name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  # A manual run always executes every gate, whatever the branch touched.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to test (default: the dispatched ref)'
        type: string
        required: false

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the four gates a change can affect. Every gate keeps its
  # name (the branch ruleset requires all four by name), and a gate that has
  # nothing to do is *skipped* at the job level: a skipped job still reports
  # a conclusion, which satisfies the ruleset, whereas an `on.paths` filter
  # would leave the required check missing and the PR unmergeable.
  #
  # Only pull requests are filtered. A push to main, a workflow_call from the
  # schedule sync, and a manual dispatch run everything, so main always has
  # full evidence and a stale filter can never hide a regression there.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 'true' when the web build, the Playwright suites, or the packages
      # they import could differ; always 'true' outside a pull request.
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      # 'true' when the Compose client, its bundled data, or the Maestro
      # flows could differ; always 'true' outside a pull request.
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      # 'true' when a pull request touches neither of the above, so only the
      # `checks` job (which formats the markdown) has anything to do.
      docs-only: ${{ github.event_name == 'pull_request' && steps.filter.outputs.web != 'true' && steps.filter.outputs.native != 'true' }}
    steps:
      # No checkout: on pull_request the action lists the PR's files through
      # the API, and on every other event this step does not run.
      # Hash-pinned: dorny is outside the actions/* org the rest of this file
      # trusts by major tag. Renovate keeps the digest current (the comment
      # carries the version it resolves).
      - name: Compare the pull request against its base
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Feeds `e2e`. Everything pnpm builds for the PWA: the app, every
            # workspace package (apps/web depends on all of them), the event
            # bundles it serves, the tools that verify fixtures and venues,
            # and the root toolchain files that change what a build means.
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'events/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            # Feeds `native` and `android-emulator`. The Compose client and its
            # Gradle wrapper, plugin and version catalog live under
            # apps/android; app/build.gradle.kts also copies the event bundle
            # and the venue assets from apps/web/static into the APK, the
            # Robolectric tests read packages/test-fixtures and the model
            # contract in packages/model, and the emulator job drives the
            # flows in .maestro through the scripts named here.
            native:
              - 'apps/android/**'
              - 'apps/web/static/venues/**'
              - 'packages/test-fixtures/**'
              - 'packages/model/**'
              - 'events/**'
              - '.maestro/**'
              - 'scripts/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

      - name: Summarise the decision
        env:
          WEB: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
          NATIVE: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
        run: |
          {
            echo "| Gate | Runs |"
            echo "| --- | --- |"
            echo "| Format · Lint · Typecheck · Test · Build | always |"
            echo "| Playwright E2E (with time-travel) | $WEB |"
            echo "| Native Compose client | $NATIVE |"
            echo "| Android emulator (Maestro) | $NATIVE (after the native job succeeds) |"
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit + property tests
        run: pnpm -r test

      - name: Verify captured fixtures
        run: |
          pnpm --filter @indiafoss/fixture-recorder exec tsx src/index.ts verify indiafoss-2025
          pnpm --filter @indiafoss/fixture-recorder exec tsx src/index.ts verify indiafoss-2026

      - name: Validate venue assets
        run: |
          pnpm --filter @indiafoss/venue-validator exec tsx src/index.ts "$PWD/events" synthetic
          pnpm --filter @indiafoss/venue-validator exec tsx src/index.ts "$PWD/events" indiafoss-2026

      - name: Build (packages + web PWA)
        run: pnpm -r build

      - name: Dependency/security audit
        run: pnpm audit --prod
        continue-on-error: true # report only for now; make blocking once deps settle

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12 -t pnpm -o sbom.cdx.json --no-recurse

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: warn

  e2e:
    name: Playwright E2E (with time-travel)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @indiafoss/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @indiafoss/web build

      - name: Run browser E2E tests
        run: pnpm --filter @indiafoss/web exec playwright test tests/app.spec.ts tests/discovery.spec.ts tests/personal-data.spec.ts tests/profile-import.spec.ts tests/ticket-contact.spec.ts tests/native-download.spec.ts tests/chat-download.spec.ts

      # Headless Chromium denies OS notifications even with a permission override.
      - name: Test mobile notification delivery with a real service worker
        run: xvfb-run -a pnpm --filter @indiafoss/web exec playwright test tests/mobile-reminders.spec.ts --headed

      - name: Run accessibility checks
        run: pnpm --filter @indiafoss/web exec playwright test tests/a11y.spec.ts

      # The QR scanner, against Chromium's fake capture device. It needs its own
      # step for the same reason as the gates below: `test:e2e` runs app.spec.ts
      # and nothing else, so a spec not named in this file has never run.
      - name: Run the camera gate
        run: pnpm --filter @indiafoss/web exec playwright test tests/camera.spec.ts

      - name: Run offline E2E gate
        run: pnpm --filter @indiafoss/web exec playwright test tests/offline.spec.ts

      - name: Run the day-simulator gate
        run: pnpm --filter @indiafoss/web exec playwright test tests/simulate.spec.ts

      # The design tokens and the revision-handling gates. `test:e2e` only runs
      # app.spec.ts, so a spec that is not named here never runs in CI.
      - name: Run the design and revision gates
        run: pnpm --filter @indiafoss/web exec playwright test tests/design.spec.ts tests/updates.spec.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results

  native:
    name: Native Compose client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Core and app tests (including Robolectric screen renders)
        run: bash scripts/android-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-screenshots
          path: apps/android/native/app/build/screenshots
          if-no-files-found: warn

      - name: Assemble debug APK
        run: cd apps/android/native && ./gradlew :app:assembleDebug

      - name: Verify nightly signing and rejection paths with a disposable key
        run: |
          (cd apps/android/native && ./gradlew :app:assembleRelease)
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          export APKSIGNER="$build_tools/apksigner" ZIPALIGN="$build_tools/zipalign"
          bash scripts/test-nightly-signing.sh apps/android/native/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Checksum the APK
        run: |
          cd apps/android/native/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: native-apk
          path: |
            apps/android/native/app/build/outputs/apk/debug/app-debug.apk
            apps/android/native/app/build/outputs/apk/debug/app-debug.apk.sha256

  android-emulator:
    name: Android emulator (Maestro)
    runs-on: ubuntu-latest
    # Reuses the debug APK the native job already produced and uploaded, so
    # this costs an emulator boot rather than a second Gradle run. Skipped
    # (not failed) when native has nothing to do; the explicit result check
    # means a cancelled or failed native job never lets this one start.
    needs: [changes, native]
    if: needs.changes.outputs.native == 'true' && needs.native.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the debug APK
        uses: actions/download-artifact@v8
        with:
          name: native-apk
          path: apk

      # Without this the emulator silently falls back to software rendering
      # and the job times out instead of failing with something readable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-default-x86_64

      - name: Create the AVD and snapshot it
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and cached"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot, install and drive the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/android-emulator-test.sh

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator
          path: |
            emulator-artifacts/
          if-no-files-found: warn
