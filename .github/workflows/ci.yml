name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit + property tests
        run: pnpm -r test

      - name: Verify captured fixtures
        run: pnpm --filter @indiafoss/fixture-recorder exec tsx src/index.ts verify indiafoss-2025

      - name: Validate venue assets
        run: |
          pnpm --filter @indiafoss/venue-validator exec tsx src/index.ts "$PWD/events" synthetic
          pnpm --filter @indiafoss/venue-validator exec tsx src/index.ts "$PWD/events" indiafoss-2026

      - name: Build (packages + web PWA)
        run: pnpm -r build

      - name: Dependency/security audit
        run: pnpm audit --prod
        continue-on-error: true # report only for now; make blocking once deps settle

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12 -t pnpm -o sbom.cdx.json --no-recurse

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: warn

  e2e:
    name: Playwright E2E (with time-travel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @indiafoss/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @indiafoss/web build

      - name: Run browser E2E tests
        run: pnpm --filter @indiafoss/web test:e2e

      - name: Run accessibility checks
        run: pnpm --filter @indiafoss/web exec playwright test tests/a11y.spec.ts

      - name: Run offline E2E gate
        run: pnpm --filter @indiafoss/web exec playwright test tests/offline.spec.ts

      - name: Run the day-simulator gate
        run: pnpm --filter @indiafoss/web exec playwright test tests/simulate.spec.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @indiafoss/web build

      - name: Add Android platform
        run: pnpm --filter @indiafoss/android exec cap add android

      - name: Sync web assets
        # PR CI builds the plain companion: fast, and it needs no bindings.
        # The nightly fetches the .aar (built from source by
        # neutrino-bindings.yml) and ships the P2P variant.
        run: pnpm --filter @indiafoss/android build

      - name: Assemble debug APK
        run: cd apps/android/capacitor/android && ./gradlew assembleDebug

      - name: Checksum the APK
        run: |
          cd apps/android/capacitor/android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            apps/android/capacitor/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/capacitor/android/app/build/outputs/apk/debug/app-debug.apk.sha256

  native:
    name: Native Compose client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: cd apps/android/native && ./gradlew :core:test

      - name: Assemble debug APK
        run: cd apps/android/native && ./gradlew :app:assembleDebug

      - name: Checksum the APK
        run: |
          cd apps/android/native/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-apk
          path: |
            apps/android/native/app/build/outputs/apk/debug/app-debug.apk
            apps/android/native/app/build/outputs/apk/debug/app-debug.apk.sha256
