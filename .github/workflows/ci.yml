name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit + property tests
        run: pnpm -r test

      - name: Verify captured fixtures
        run: pnpm --filter @indiafoss/fixture-recorder exec tsx src/index.ts verify indiafoss-2025

      - name: Validate venue assets
        run: |
          pnpm --filter @indiafoss/venue-validator exec tsx src/index.ts "$PWD/events" synthetic
          pnpm --filter @indiafoss/venue-validator exec tsx src/index.ts "$PWD/events" indiafoss-2026

      - name: Build (packages + web PWA)
        run: pnpm -r build

      - name: Dependency/security audit
        run: pnpm audit --prod
        continue-on-error: true # report only for now; make blocking once deps settle

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12 -t pnpm -o sbom.cdx.json --no-recurse

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: warn

  e2e:
    name: Playwright E2E (with time-travel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @indiafoss/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @indiafoss/web build

      - name: Run browser E2E tests
        run: pnpm --filter @indiafoss/web test:e2e

      - name: Run accessibility checks
        run: pnpm --filter @indiafoss/web exec playwright test tests/a11y.spec.ts

      - name: Run offline E2E gate
        run: pnpm --filter @indiafoss/web exec playwright test tests/offline.spec.ts

      - name: Run the day-simulator gate
        run: pnpm --filter @indiafoss/web exec playwright test tests/simulate.spec.ts

      # The design tokens and the revision-handling gates. `test:e2e` only runs
      # app.spec.ts, so a spec that is not named here never runs in CI.
      - name: Run the design and revision gates
        run: pnpm --filter @indiafoss/web exec playwright test tests/design.spec.ts tests/updates.spec.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results

  native:
    name: Native Compose client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: cd apps/android/native && ./gradlew :core:test

      - name: Screen renders (Robolectric screenshots)
        run: cd apps/android/native && ./gradlew :app:testDebugUnitTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-screenshots
          path: apps/android/native/app/build/screenshots
          if-no-files-found: warn

      - name: Assemble debug APK
        run: cd apps/android/native && ./gradlew :app:assembleDebug

      - name: Checksum the APK
        run: |
          cd apps/android/native/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-apk
          path: |
            apps/android/native/app/build/outputs/apk/debug/app-debug.apk
            apps/android/native/app/build/outputs/apk/debug/app-debug.apk.sha256

  android-emulator:
    name: Android emulator (Maestro)
    runs-on: ubuntu-latest
    # Reuses the debug APK the native job already produced and uploaded, so
    # this costs an emulator boot rather than a second Gradle run.
    needs: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the debug APK
        uses: actions/download-artifact@v4
        with:
          name: native-apk
          path: apk

      # Without this the emulator silently falls back to software rendering
      # and the job times out instead of failing with something readable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-default-x86_64

      - name: Create the AVD and snapshot it
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and cached"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot, install and drive the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/android-emulator-test.sh

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator
          path: |
            emulator-artifacts/
          if-no-files-found: warn
