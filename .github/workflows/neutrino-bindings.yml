name: Neutrino bindings

# Builds the Neutrino BLE bindings (.aar) from source and publishes them as a
# release asset, so building the P2P variant of the Android app needs no
# credentials from anyone.
#
# Why this exists: the upstream artifact is published to GitHub Packages, and
# GitHub Packages will not serve Maven artifacts anonymously — a request with
# no credentials is 401 even though element-hq/neutrino-iroh is a public,
# AGPL-3.0-or-later repository. Rather than make every contributor (and the
# nightly) carry a personal access token, we build the same .aar ourselves from
# a pinned tag and attach it to a release, which GitHub *does* serve
# anonymously.
#
# Run it by hand (workflow_dispatch) when NEUTRINO_REF changes. The build is
# slow (Rust, four Android ABIs) and the output only changes when the pin does.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'neutrino-iroh tag to build (e.g. v0.8.2)'
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/neutrino-bindings.yml'
      - 'apps/android/capacitor/neutrino/version.json'

permissions:
  contents: write

concurrency:
  group: neutrino-bindings
  cancel-in-progress: false

jobs:
  build:
    name: Build the .aar from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned version
        id: pin
        run: |
          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then
            ref=$(node -p "require('./apps/android/capacitor/neutrino/version.json').ref")
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "Building neutrino-iroh $ref"

      - name: Check out neutrino-iroh
        uses: actions/checkout@v4
        with:
          repository: element-hq/neutrino-iroh
          ref: ${{ steps.pin.outputs.ref }}
          path: neutrino-iroh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        # r27c, as build-aar.sh's header requires.
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Install the host build dependencies
        # blew's bluer backend is compiled on the host so uniffi-bindgen can
        # load the cdylib and generate the Kotlin.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Install the Rust toolchain and Android targets
        # iroh-ble-transport 0.1.2 sets rust-version 1.95, so an older default
        # toolchain fails the build outright ("not supported by the following
        # package"). Take current stable rather than pinning a version that
        # would rot.
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          rustup target add \
            aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neutrino-iroh

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the .aar
        working-directory: neutrino-iroh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./build-aar.sh --version "${{ steps.pin.outputs.version }}"

      - name: Collect the artifact
        id: collect
        run: |
          mkdir -p dist
          aar=$(find neutrino-iroh/bindings/build/outputs/aar -name '*.aar' | head -1)
          test -n "$aar" || { echo "no .aar produced"; exit 1; }
          cp "$aar" dist/neutrino-bindings-${{ steps.pin.outputs.version }}.aar
          cd dist
          sha256sum *.aar > neutrino-bindings-${{ steps.pin.outputs.version }}.aar.sha256
          cat *.sha256
          ls -la

      - name: Publish as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neutrino-bindings-${{ steps.pin.outputs.version }}
          name: Neutrino bindings ${{ steps.pin.outputs.version }}
          prerelease: true
          # AGPL-3.0-or-later, redistributed under the same licence as this app.
          body: |
            `io.element.neutrino:bindings:${{ steps.pin.outputs.version }}`, built from source
            from [element-hq/neutrino-iroh@${{ steps.pin.outputs.ref }}](https://github.com/element-hq/neutrino-iroh/tree/${{ steps.pin.outputs.ref }})
            by [`neutrino-bindings.yml`](../../blob/main/.github/workflows/neutrino-bindings.yml).

            Published here because GitHub Packages does not serve Maven artifacts
            anonymously, so consuming the upstream build would require every
            contributor to hold a personal access token.

            The `.aar` is AGPL-3.0-only (it bundles the AGPL `blew` and
            `iroh-ble-transport` crates); this repository is AGPL-3.0-or-later.
            Source: <https://github.com/element-hq/neutrino-iroh>.
          files: |
            dist/neutrino-bindings-${{ steps.pin.outputs.version }}.aar
            dist/neutrino-bindings-${{ steps.pin.outputs.version }}.aar.sha256
          overwrite_files: true
