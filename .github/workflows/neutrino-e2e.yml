name: Neutrino e2e

# Builds the Neutrino homeserver we actually ship — our fork, at the rev pinned
# in patches/neutrino/version.json — and runs the companion's
# chat contracts against it, including the two-node proofs: an encrypted
# message from one of our client sessions decrypting on the other node, and
# the same after node B is killed and restarted.
#
# Three things this catches that unit tests cannot:
#
#   - a contract we depend on breaking (mesh chat silently stops working),
#   - a fork patch regressing against the client that uses it, and
#   - a gap in stock Neutrino closing — the tripwire tests assert each missing
#     feature is still missing, so implementing one turns the stock run red and
#     we go and enable the feature instead of never noticing.
#
# The fork run is on the PR path for the packages that talk to it. The stock
# run stays weekly: its result depends on upstream, not on the pull request.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'neutrino ref to test against (default: the pinned fork rev)'
        required: false
      repo:
        description: 'neutrino repository (default: the pinned fork)'
        required: false
  pull_request:
    paths:
      - 'packages/matrix/**'
      - 'patches/neutrino/**'
      - 'tools/neutrino-probe/**'
      - 'patches/neutrino/version.json'
      - '.github/workflows/neutrino-e2e.yml'
  schedule:
    # Mondays, 06:00 UTC — the stock upstream run.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: neutrino-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Chat contracts against a live Neutrino
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decide which Neutrino to build
        id: which
        run: |
          pin=./patches/neutrino/version.json
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Weekly: stock upstream main, tripwires armed.
            echo "repo=element-hq/neutrino" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "fork=0" >> "$GITHUB_OUTPUT"
          else
            repo="${{ inputs.repo }}"; ref="${{ inputs.ref }}"
            [ -n "$repo" ] || repo=$(node -p "require('$pin').neutrino.repo")
            [ -n "$ref" ] || ref=$(node -p "require('$pin').neutrino.rev")
            echo "repo=$repo" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            if [ "$repo" = "element-hq/neutrino" ]; then echo "fork=0"; else echo "fork=1"; fi >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Check out neutrino
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.which.outputs.repo }}
          ref: ${{ steps.which.outputs.ref }}
          path: neutrino

      - name: Install the Rust toolchain
        # Neutrino's dependency tree tracks recent Rust; take current stable
        # rather than pinning a version that would rot.
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neutrino

      - name: Build the neutrino dev binary
        working-directory: neutrino
        run: cargo build --bin neutrino

      - name: Start two nodes
        # Two servers that federate with each other over loopback HTTP: the
        # two-node proofs need a peer to encrypt to. Distinct server names so
        # the users differ (@alice:127.0.0.1:8008 vs :8009).
        run: |
          bin=./neutrino/target/debug/neutrino
          for port in 8008 8009 8010; do
            mkdir -p /tmp/node-$port
            NEUTRINO_SERVER_NAME=127.0.0.1:$port NEUTRINO_BIND_ADDR=127.0.0.1:$port \
              NEUTRINO_STORAGE_DIR=/tmp/node-$port NEUTRINO_STARTUP_JITTER_MS=0 \
              $bin > /tmp/node-$port/log 2>&1 &
          done
          for port in 8008 8009 8010; do
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:$port/_matrix/client/versions >/dev/null; then
                echo "node $port is up"; break
              fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:$port/_matrix/client/versions >/dev/null \
              || { echo "node $port did not start"; cat /tmp/node-$port/log; exit 1; }
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the chat contracts and the two-node proofs
        env:
          NEUTRINO_URL: http://127.0.0.1:8008
          NEUTRINO_URL_B: http://127.0.0.1:8009
          # A third node: the group-E2EE contract needs the sender's key share
          # fanned out to two *distinct* homeservers, which no two-node rig can
          # exercise (mesh-e2ee.e2e.test.ts skips itself without it).
          NEUTRINO_URL_C: http://127.0.0.1:8010
          NEUTRINO_FORK: ${{ steps.which.outputs.fork }}
          # The restart proof starts its own nodes on 8018/8019.
          NEUTRINO_BIN: ${{ github.workspace }}/neutrino/target/debug/neutrino
        run: pnpm --filter @indiafoss/neutrino-probe test

      - name: Refresh the capability matrix
        # Printed into the job summary so a drift is visible without reading
        # the diff of docs/neutrino-capabilities.md.
        if: always()
        run: |
          echo "## Neutrino capability probe (${{ steps.which.outputs.repo }}@${{ steps.which.outputs.ref }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm --filter @indiafoss/neutrino-probe start >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Server logs
        if: failure()
        run: |
          for port in 8008 8009; do echo "=== node $port ==="; tail -80 /tmp/node-$port/log; done

  medium-e2ee:
    name: E2EE over the iroh medium
    # The plain-HTTP job above proves the crypto and the key-transport logic;
    # this one proves the *medium* carries it. Federation here rides the CoAP
    # sidecar over an iroh QUIC link with mDNS discovery — the exact path two
    # phones use — so a regression in the datagram framing or in which EDU
    # kinds the sidecar forwards fails here and nowhere else. It found nothing
    # on its first run precisely because the branch already carries the
    # transport; the job exists so that stays true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out neutrino-iroh
        uses: actions/checkout@v7
        with:
          repository: hanthor/neutrino-iroh
          path: neutrino-iroh

      - name: Install the Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neutrino-iroh

      - name: Build neutrino-lan
        working-directory: neutrino-iroh
        run: cargo build --release -p neutrino-ffi-ble --bin neutrino-lan

      - name: Start three nodes on the iroh medium
        # Distinct loopback aliases per node: on one host every node would
        # otherwise advertise the same addresses and differ only by port,
        # which is not a topology iroh is designed for. --fed-port is what
        # routes federation onto the medium at all; without it the nodes
        # would federate over plain HTTP and this job would silently test
        # the same thing as the one above.
        run: |
          bin=./neutrino-iroh/target/release/neutrino-lan
          i=0
          for port in 8008 8009 8010; do
            i=$((i+1))
            mkdir -p /tmp/mesh-$port
            $bin --bind 127.0.0.1:$port --fed-port $((port+200)) \
                 --relay-bind 127.0.4.$i:0 --storage /tmp/mesh-$port \
                 > /tmp/mesh-$port/log 2>&1 &
          done
          for port in 8008 8009 8010; do
            for _ in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:$port/_matrix/client/versions >/dev/null; then
                echo "node $port is up"; break
              fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:$port/_matrix/client/versions >/dev/null \
              || { echo "node $port did not start"; cat /tmp/mesh-$port/log; exit 1; }
          done
          # mDNS discovery needs a moment to find and probe the peers before
          # the first federation request, or it pays a dial timeout.
          sleep 30

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the E2EE and alias contracts over the medium
        env:
          NEUTRINO_URL: http://127.0.0.1:8008
          NEUTRINO_URL_B: http://127.0.0.1:8009
          NEUTRINO_URL_C: http://127.0.0.1:8010
          NEUTRINO_FORK: '1'
        # One vitest process per suite, deliberately. Two crypto-heavy suites
        # in one process stall the first suite's sync loop often enough to fail
        # either of them, and the failure wears a convincing federation
        # costume — a receiver holding ciphertext and "waiting for the key" —
        # that cost a real debugging day. The same suites pass back-to-back in
        # fresh processes on the same nodes. Client coupling, not the medium;
        # this job exists to catch the medium.
        run: |
          pnpm --filter @indiafoss/neutrino-probe exec vitest run src/two-nodes.e2e.test.ts
          pnpm --filter @indiafoss/neutrino-probe exec vitest run src/mesh-e2ee.e2e.test.ts
          pnpm --filter @indiafoss/neutrino-probe exec vitest run src/aliases.e2e.test.ts

      - name: Node logs
        if: failure()
        run: |
          for port in 8008 8009 8010; do
            echo "=== node $port ==="; tail -n 120 /tmp/mesh-$port/log || true
          done

  flaky-link:
    name: E2EE survives a flaky link and a crash
    # The plain-HTTP job proves the crypto; the medium job proves the medium
    # carries it; this one proves it survives the two things a venue guarantees
    # and no other job reproduces — a BLE-grade link (latency + jitter) and a
    # phone whose node is SIGKILLed mid-key-delivery. An end-to-end HEAL gate:
    # the composed medium must still deliver a decryptable message after the
    # crash, by durability or by client key re-request. The isolated,
    # deterministic durability red/green is the fork's own `cargo nextest`
    # (room_key_is_durable_...); this catches the integration regressions that
    # only surface end to end — the medium dropping to-device, or the sender's
    # backoff not resuming after the crash. The node here is `neutrino-lan`
    # with its plain-
    # UDP test transport (NEUTRINO_SIM_LINK); the test spawns, kills, and
    # restarts its own nodes and runs the impairment proxies in-process, so it
    # needs no pre-started servers, no root, and no kernel netem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out neutrino-iroh
        uses: actions/checkout@v7
        with:
          repository: hanthor/neutrino-iroh
          path: neutrino-iroh

      - name: Install the Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neutrino-iroh

      - name: Build neutrino-lan
        working-directory: neutrino-iroh
        run: cargo build --release -p neutrino-ffi-ble --bin neutrino-lan

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the flaky-link crash simulation
        env:
          NEUTRINO_FLAKY_SIM: '1'
          NEUTRINO_LAN_BIN: ${{ github.workspace }}/neutrino-iroh/target/release/neutrino-lan
        run: |
          pnpm --filter @indiafoss/neutrino-probe exec vitest run src/flaky-link.e2e.test.ts

      - name: Node logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/flaky-*.log /tmp/flaky-*.log; do
            [ -f "$f" ] && { echo "=== $f ==="; tail -n 200 "$f"; }
          done || true
