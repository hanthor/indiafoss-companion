name: Nightly APK

# Publishes the latest main's native Android client as an installable debug
# APK on the rolling "nightly" pre-release so testers never need a GitHub
# login for artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish nightly APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Identify the build
        id: build
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=2026.$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        working-directory: apps/android/native
        env:
          NIGHTLY_VERSION: ${{ steps.build.outputs.version }}
          NIGHTLY_CODE: ${{ steps.build.outputs.code }}
        run: ./gradlew :app:assembleDebug -PnightlyVersionName="$NIGHTLY_VERSION" -PnightlyVersionCode="$NIGHTLY_CODE"

      - name: Name and checksum the APK
        run: |
          mkdir -p dist
          cp apps/android/native/app/build/outputs/apk/debug/app-debug.apk dist/indiafoss-companion-nightly.apk
          cd dist && sha256sum indiafoss-companion-nightly.apk > indiafoss-companion-nightly.apk.sha256
          cat indiafoss-companion-nightly.apk.sha256

      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish to the nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: IndiaFOSS 2026 nightly · ${{ steps.build.outputs.date }} · ${{ steps.build.outputs.version }}
          prerelease: true
          body: |
            Android preview built **${{ steps.build.outputs.built_at }}** from [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            **[Download the Android APK](https://github.com/${{ github.repository }}/releases/download/nightly/indiafoss-companion-nightly.apk)** · [Open the PWA](https://hanthor.github.io/indiafoss-companion/)

            Includes the IndiaFOSS 2026 draft programme. In the Android app, Settings → About should show **${{ steps.build.outputs.version }}** (build ${{ steps.build.outputs.code }}).

            This is a rolling preview: the release's original publication date is not the APK build date. The timestamp and build identifier above describe the current download. Draft sessions and times may change.

            Debug APK for testing. Nightlies currently use runner-generated signing keys, so an in-place update may be rejected. Do not uninstall an existing app without preserving your local data.

            [Build log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) · SHA-256 checksum attached below.
          files: |
            dist/indiafoss-companion-nightly.apk
            dist/indiafoss-companion-nightly.apk.sha256
