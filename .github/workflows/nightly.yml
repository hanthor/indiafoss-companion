name: Nightly APK

# Publishes the latest main as an installable debug APK on the rolling
# "nightly" pre-release so testers never need a GitHub login for artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish nightly APK
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be used in `if:`; expose presence as a job env flag.
      HAS_NEUTRINO_TOKEN: ${{ secrets.NEUTRINO_PACKAGES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @indiafoss/web build

      - name: Add Android platform
        run: pnpm --filter @indiafoss/android exec cap add android

      - name: Probe GitHub Packages for the Neutrino bindings
        # Decides whether the P2P plugin can be built. GitHub Packages answers
        # "429 Rate limit exceeded" for credentials it will not serve (e.g. a
        # fine-grained PAT); in that case the nightly ships the plain companion
        # instead of failing. The token itself is never printed.
        id: probe
        if: env.HAS_NEUTRINO_TOKEN == 'true'
        env:
          NEUTRINO_PACKAGES_TOKEN: ${{ secrets.NEUTRINO_PACKAGES_TOKEN }}
          NEUTRINO_PACKAGES_USER: ${{ github.actor }}
        run: |
          base=https://maven.pkg.github.com/element-hq/neutrino-iroh/io/element/neutrino/bindings
          code=$(curl -sS -u "$NEUTRINO_PACKAGES_USER:$NEUTRINO_PACKAGES_TOKEN" -o /tmp/probe.out -w '%{http_code}' "$base/0.8.2/bindings-0.8.2.pom" || echo 000)
          echo "bindings-0.8.2.pom -> HTTP $code"
          head -c 300 /tmp/probe.out; echo
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neutrino bindings not readable with NEUTRINO_PACKAGES_TOKEN (HTTP $code); building the plain companion. A classic PAT with read:packages is required."
          fi

      - name: Sync web assets
        env:
          NEUTRINO_PACKAGES_TOKEN: ${{ steps.probe.outputs.ok == 'true' && secrets.NEUTRINO_PACKAGES_TOKEN || '' }}
          NEUTRINO_PACKAGES_USER: ${{ github.actor }}
        run: pnpm --filter @indiafoss/android build

      - name: Assemble debug APK
        env:
          NEUTRINO_PACKAGES_TOKEN: ${{ steps.probe.outputs.ok == 'true' && secrets.NEUTRINO_PACKAGES_TOKEN || '' }}
          NEUTRINO_PACKAGES_USER: ${{ github.actor }}
        run: cd apps/android/capacitor/android && ./gradlew assembleDebug

      - name: Name and checksum the APK
        run: |
          mkdir -p dist
          cp apps/android/capacitor/android/app/build/outputs/apk/debug/app-debug.apk dist/indiafoss-companion-nightly.apk
          cd dist && sha256sum indiafoss-companion-nightly.apk > indiafoss-companion-nightly.apk.sha256
          cat indiafoss-companion-nightly.apk.sha256

      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish to the nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: |
            Latest `main` (${{ github.sha }}) as a debug APK. Install over the previous nightly.
            P2P chat plugin included: ${{ steps.probe.outputs.ok == 'true' }} (requires a classic PAT with read:packages as NEUTRINO_PACKAGES_TOKEN).
          files: |
            dist/indiafoss-companion-nightly.apk
            dist/indiafoss-companion-nightly.apk.sha256
