name: Nightly APK

# Publishes the latest main's native Android client as an installable debug
# APK on the rolling "nightly" pre-release so testers never need a GitHub
# login for artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish nightly APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: cd apps/android/native && ./gradlew :app:assembleDebug

      - name: Name and checksum the APK
        run: |
          mkdir -p dist
          cp apps/android/native/app/build/outputs/apk/debug/app-debug.apk dist/indiafoss-companion-nightly.apk
          cd dist && sha256sum indiafoss-companion-nightly.apk > indiafoss-companion-nightly.apk.sha256
          cat indiafoss-companion-nightly.apk.sha256

      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish to the nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: |
            Latest `main` (${{ github.sha }}) as a debug APK. Install over the previous nightly.
          files: |
            dist/indiafoss-companion-nightly.apk
            dist/indiafoss-companion-nightly.apk.sha256
