name: Import the official IndiaFOSS schedule

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-schedule-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hanthor/indiafoss-companion' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      head: ${{ steps.candidate.outputs.head }}
      base: ${{ steps.candidate.outputs.base }}
      pr: ${{ steps.candidate.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch and reconcile the published programme
        run: pnpm --filter @indiafoss/event-sync exec tsx src/index.ts sync indiafoss-2026 --source live
      - name: Copy the published bundle to what the apps actually serve
        run: pnpm --filter @indiafoss/event-sync exec tsx src/index.ts publish indiafoss-2026
      - name: Prepare a data-only candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git add events/indiafoss-2026/raw events/indiafoss-2026/normalized events/indiafoss-2026/published events/indiafoss-2026/activity-ids.json apps/web/static/events/indiafoss-2026
          if git diff --cached --quiet -- events/indiafoss-2026/published/manifest.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The public programme is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              events/indiafoss-2026/raw/*.json|events/indiafoss-2026/normalized/*.json|events/indiafoss-2026/published/*.json|events/indiafoss-2026/activity-ids.json) ;;
              apps/web/static/events/indiafoss-2026/*.json) ;;
              *) echo "Unexpected candidate path: $file"; exit 1 ;;
            esac
          done
          # A run whose base moved during validation leaves its candidate open. The
          # next run re-syncs from live, so that candidate is stale by definition:
          # close it instead of letting a second PR for the same job pile up (#193).
          gh pr list --repo "$GH_REPO" --state open --base main --limit 100 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/schedule-")) | .number' |
          while IFS= read -r stale; do
            [ -n "$stale" ] || continue
            gh pr close "$stale" --repo "$GH_REPO" --delete-branch \
              --comment 'Superseded: a newer sync run re-imported the published programme from the live APIs. Closing so only one automated schedule candidate is ever open.'
            echo "Closed superseded candidate #$stale" >> "$GITHUB_STEP_SUMMARY"
          done
          branch="automation/schedule-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh the official IndiaFOSS 2026 programme'
          head=$(git rev-parse HEAD)
          git push origin "$branch"
          printf '%s\n' 'Automatically imported from the public FOSS United APIs. Talk choice keys are reconciled through CFP identity. The complete reusable CI workflow must pass before this data-only PR is merged. Main must still match the tested base.' > "$RUNNER_TEMP/schedule-pr.md"
          pr=$(gh pr create --base main --head "$branch" --title 'Refresh the official IndiaFOSS 2026 programme' --body-file "$RUNNER_TEMP/schedule-pr.md")
          {
            echo "changed=true"
            echo "head=$head"
            echo "base=$base"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate: $pr" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      ref: ${{ needs.prepare.outputs.head }}

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge only the tested candidate on its unchanged base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_HEAD: ${{ needs.prepare.outputs.head }}
          SYNC_BASE: ${{ needs.prepare.outputs.base }}
          SYNC_PR: ${{ needs.prepare.outputs.pr }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$SYNC_BASE" ]; then
            # Not a failure: the next hourly run re-imports onto the new main
            # and closes this candidate as superseded.
            echo 'Main advanced during validation; the next run re-imports onto it.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$SYNC_PR" --squash --delete-branch --match-head-commit "$SYNC_HEAD"
          # Bot-authored pushes do not trigger other workflows. Dispatch explicitly.
          gh workflow run pages.yml --ref main
          gh workflow run nightly.yml --ref main
          echo "Validated and merged $SYNC_PR; PWA deployment and nightly builds dispatched." >> "$GITHUB_STEP_SUMMARY"

  # A failing import is invisible from the app: attendees just keep the old
  # programme. So a failed run opens (or adds to) one tracking issue, and the
  # next good run closes it. The issue is how anyone learns the sync is stuck.
  report:
    needs: [prepare, validate, publish]
    if: always() && github.repository == 'hanthor/indiafoss-companion'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the sync-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREPARE: ${{ needs.prepare.result }}
          VALIDATE: ${{ needs.validate.result }}
          PUBLISH: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Schedule sync is failing'
          open=$(gh issue list --repo "$GH_REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          failed=false
          for r in "$PREPARE" "$VALIDATE" "$PUBLISH"; do
            case "$r" in failure|cancelled) failed=true ;; esac
          done
          if [ "$failed" = true ]; then
            body="The hourly import did not publish: prepare=$PREPARE, validate=$VALIDATE, publish=$PUBLISH. Attendees keep the last published programme until this is fixed. Run: $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GH_REPO" --body "$body"
            else
              gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
            fi
            exit 0
          fi
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GH_REPO" --comment "Recovered: $RUN_URL ran clean."
          fi
