# A first run gets past setup and onto a screen with real content.
#
# `smoke.yaml` proves the shell rendered. This goes one step further and
# proves the app is usable: setup is dismissed, a tab navigates, and the
# screen behind it draws its own content rather than an empty frame.
#
# Deliberately narrow. An earlier version walked all five tabs and cost eight
# red CI runs, because a failed assertion cannot distinguish "this screen did
# not render" from "the tap never left the previous screen" — and it was the
# latter. Everything asserted here has passed on CI hardware; see
# docs/android-testing.md for what a wider walk needs first.
#
# Selector rules, each learned from one of those runs:
#
#   1. Real text nodes only. A placeholder is an attribute on an <input>, so
#      it never reaches the accessibility tree — `Search sessions…` is a
#      hintText, not text, and no timeout makes it matchable.
#   2. A selector is a regex matched against an element's ENTIRE text. Wrap
#      anything sharing a node with other text in `.*`.
#   3. Unconditional chrome, never programme content: a talk title has to be
#      rewritten every republish.
appId: org.indiafoss.companion
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'Now'
    timeout: 60000
- takeScreenshot: 01-first-run

# `clearState: true` makes every run a first run, and a first run opens the
# setup flow ("SET UP IN A MINUTE" — reminders, ticket, name, ranking). The
# tab bar renders behind it, so the app looks navigable while the setup card
# still owns the screen. Conditional, so the flow survives onboarding being
# moved, reworded, or dropped on a cleared install.
- runFlow:
    when:
      visible: '.*Skip setup.*'
    commands:
      - tapOn: '.*Skip setup.*'

# Schedule is the deepest screen proved on CI hardware. Filters is a
# <summary> and List/Timeline are <button>s — each holds exactly its own
# text — and "Conference day" is the day picker's own label, so together
# they mean the route resolved *and* the bundle was read.
- tapOn: 'Schedule'
- extendedWaitUntil:
    visible: 'Filters'
    timeout: 30000
- assertVisible: 'Timeline'
- assertVisible: 'List'
- assertVisible: '.*Conference day.*'
- takeScreenshot: 02-schedule
