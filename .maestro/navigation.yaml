# A first run gets past setup and onto a screen with real content, then
# proves a second tab works too.
#
# `smoke.yaml` proves the app rendered. This goes one step further: setup is
# dismissed, two different tabs navigate, and each screen behind them draws
# its own content rather than an empty frame.
#
# Selector rules carried over from the retired Capacitor flow (see
# docs/android-testing.md) — real text nodes only, whole-text regex, never
# assert on programme content — plus one native-specific note: unlike the
# WebView tab bar, each Compose tab label is a single unambiguous text node
# (confirmed against a real device's accessibility dump), so no index
# disambiguation has been needed here yet. If a future flow hits the
# "tap didn't navigate" failure mode documented for the old app, dump the
# real tree before guessing at a new selector — that is what cost the old
# suite eight red runs.
appId: org.indiafoss.companion.nativeapp
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'Welcome'
    timeout: 60000
- takeScreenshot: 01-first-run

- tapOn: '.*Skip setup.*'

- extendedWaitUntil:
    visible: 'Now'
    timeout: 30000
- takeScreenshot: 02-now

- tapOn: 'Schedule'
- extendedWaitUntil:
    visible: 'Day 1'
    timeout: 30000
- assertVisible: 'Day 2'
- takeScreenshot: 03-schedule

- tapOn: 'My plan'
- extendedWaitUntil:
    visible: '.*Add a block of your own.*'
    timeout: 30000
- takeScreenshot: 04-my-plan
