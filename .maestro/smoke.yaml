# Does the packaged native app actually come up?
#
# Gradle assembling successfully says the code compiles; it says nothing
# about whether the Activity actually resumes. The regression this catches
# is a crash on first launch — CompanionViewModel's constructor did exactly
# this once (it read its own MutableStateFlow before assignment) and nothing
# in the build caught it.
#
# Unlike the retired Capacitor shell, the first screen here is the welcome
# card itself, not a tab bar with the card layered on top — a clean install
# has no bundle downloaded yet for the tab screens to render. So the
# assertion is about the welcome screen rendering, not the tab bar.
appId: org.indiafoss.companion.nativeapp
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'Welcome'
    timeout: 60000

- assertVisible: 'SET UP IN A MINUTE'
- assertVisible: '.*Skip setup.*'

- takeScreenshot: 01-launched
