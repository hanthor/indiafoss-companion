<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" role="img" aria-label="Synthetic two-floor venue map">
  <title>Synthetic venue (IndiaFOSS Companion fixture)</title>
  <style>
    .floor { fill: #f4f6f8; stroke: #cbd5e1; stroke-width: 2; }
    .room { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
    .room-label { font: 600 12px sans-serif; fill: #0f172a; text-anchor: middle; }
    .amenity { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .corridor { stroke: #cbd5e1; stroke-width: 6; fill: none; }
    .stairs { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
    .lift { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
  </style>

  <!-- Ground floor -->
  <g id="floor-ground">
    <rect class="floor" x="10" y="10" width="760" height="330" rx="8" />
    <path class="corridor" d="M 60 60 H 740 M 60 290 H 740 M 60 60 V 290" />
    <text class="room-label" x="400" y="28">GROUND FLOOR</text>

    <g id="room-audi-1"><rect class="room" x="80" y="80" width="200" height="90" rx="6" /><text class="room-label" x="180" y="130">Audi 1</text></g>
    <g id="room-audi-2"><rect class="room" x="420" y="80" width="220" height="90" rx="6" /><text class="room-label" x="530" y="130">Audi 2</text></g>
    <g id="room-devroom-1"><rect class="room" x="80" y="200" width="200" height="70" rx="6" /><text class="room-label" x="180" y="240">Devroom 1</text></g>
    <g id="room-workshops"><rect class="room" x="300" y="200" width="200" height="70" rx="6" /><text class="room-label" x="400" y="240">Workshops</text></g>
    <g id="room-bof"><rect class="room" x="520" y="200" width="200" height="70" rx="6" /><text class="room-label" x="620" y="240">BoF Room</text></g>
    <g id="amenity-registration"><rect class="amenity" x="300" y="80" width="100" height="40" rx="6" /><text class="room-label" x="350" y="105">Registration</text></g>
    <g id="amenity-food-ground"><rect class="amenity" x="600" y="80" width="120" height="40" rx="6" /><text class="room-label" x="660" y="105">Food Area</text></g>
    <g id="area-sponsor-booths"><rect class="room" x="660" y="200" width="90" height="70" rx="6" /><text class="room-label" x="705" y="240">Sponsor<br />Booths</text></g>
    <g id="area-hw-showcase"><rect class="room" x="600" y="150" width="70" height="40" rx="6" /><text class="room-label" x="635" y="175">HW</text></g>
    <g id="amenity-toilets-ground"><rect class="amenity" x="80" y="290" width="90" height="30" rx="6" /><text class="room-label" x="125" y="310">Toilets</text></g>
    <g id="amenity-stairs-ground"><rect class="stairs" x="300" y="290" width="60" height="30" rx="6" /><text class="room-label" x="330" y="310">Stairs</text></g>
    <g id="amenity-lift-ground"><rect class="lift" x="380" y="290" width="50" height="30" rx="6" /><text class="room-label" x="405" y="310">Lift</text></g>
  </g>

  <!-- First floor -->
  <g id="floor-first">
    <rect class="floor" x="10" y="420" width="760" height="330" rx="8" />
    <path class="corridor" d="M 60 470 H 740 M 60 700 H 740 M 60 470 V 700" />
    <text class="room-label" x="400" y="438">FIRST FLOOR</text>

    <g id="room-devroom-2"><rect class="room" x="80" y="490" width="220" height="90" rx="6" /><text class="room-label" x="190" y="540">Devroom 2</text></g>
    <g id="room-quiet"><rect class="room" x="420" y="490" width="200" height="90" rx="6" /><text class="room-label" x="520" y="540">Quiet Room</text></g>
    <g id="area-community-booths"><rect class="room" x="80" y="610" width="280" height="70" rx="6" /><text class="room-label" x="220" y="650">Community Booths</text></g>
    <g id="room-workshop-space"><rect class="room" x="380" y="610" width="200" height="70" rx="6" /><text class="room-label" x="480" y="650">Workshop Space</text></g>
    <g id="amenity-toilets-first"><rect class="amenity" x="640" y="610" width="90" height="40" rx="6" /><text class="room-label" x="685" y="635">Toilets</text></g>
    <g id="amenity-stairs-first"><rect class="stairs" x="300" y="610" width="60" height="30" rx="6" /><text class="room-label" x="330" y="630">Stairs</text></g>
    <g id="amenity-lift-first"><rect class="lift" x="380" y="610" width="50" height="30" rx="6" /><text class="room-label" x="405" y="630">Lift</text></g>
  </g>
</svg>
