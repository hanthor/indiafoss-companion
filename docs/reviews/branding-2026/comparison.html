<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>IndiaFOSS 2026 visual comparison</title
  ><style>
    body {
      margin: 0;
      padding: 24px;
      background: #f0f0f0;
      color: #141414;
      font:
        16px/1.5 system-ui,
        sans-serif;
    }
    h1,
    h2 {
      letter-spacing: -0.04em;
    }
    section {
      margin: 40px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    figure {
      margin: 0;
    }
    img {
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
    }
    figcaption {
      margin: 8px 0;
      font-weight: 600;
    }
    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

    <a href="https://fossunited.org/indiafoss/2026">Official reference</a>. Browser captures; no
